# Build otomatis mod MMD (Fabric 1.21.11) di GitHub.
# Jalan tiap push ke main/master, pull request, atau manual (tab Actions > Run workflow).
# Hasil: file .jar ada di halaman run > Artifacts (mmdskin-fabric-jar).
name: Build Fabric (otomatis)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-fabric-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------- 1) Library native Rust (Android arm64 untuk HP, Windows & Linux untuk PC) ----------
  natives:
    name: native ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: android-arm64, os: ubuntu-latest,  target: aarch64-linux-android,   lib: libmmd_engine.so }
          - { name: windows-x64,   os: windows-latest, target: x86_64-pc-windows-msvc,   lib: mmd_engine.dll }
          - { name: linux-x64,     os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, lib: libmmd_engine.so }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Kalau repo dibuat dengan upload file biasa, folder submodule bullet3 kosong -> clone sendiri
      - name: Pastikan bullet3 ada
        shell: bash
        run: |
          if [ ! -d rust_engine/deps/bullet3/src ]; then
            rm -rf rust_engine/deps/bullet3
            git clone --depth 1 https://github.com/bulletphysics/bullet3.git rust_engine/deps/bullet3
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_engine

      - name: Setup Android NDK
        if: matrix.name == 'android-arm64'
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Build (Android arm64)
        if: matrix.name == 'android-arm64'
        shell: bash
        run: |
          BIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export ANDROID_NDK_HOME="${{ steps.ndk.outputs.ndk-path }}"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$BIN/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          cargo build --release --manifest-path rust_engine/Cargo.toml --target ${{ matrix.target }}

      - name: Build (desktop)
        if: matrix.name != 'android-arm64'
        shell: bash
        run: cargo build --release --manifest-path rust_engine/Cargo.toml --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: rust_engine/target/${{ matrix.target }}/release/${{ matrix.lib }}
          if-no-files-found: error

  # ---------- 2) Jar mod Fabric ----------
  mod:
    name: jar Fabric 1.21.11
    needs: natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-libs

      - name: Setup Android NDK (untuk libc++_shared.so)
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Salin native ke resources
        run: |
          R=common/src/main/resources/natives
          mkdir -p $R/windows-x64 $R/linux-x64 $R/android-arm64
          cp native-libs/native-windows-x64/mmd_engine.dll    $R/windows-x64/
          cp native-libs/native-linux-x64/libmmd_engine.so    $R/linux-x64/
          cp native-libs/native-android-arm64/libmmd_engine.so $R/android-arm64/
          cp "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" $R/android-arm64/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric
        run: |
          chmod +x gradlew
          ./gradlew :fabric:build -x test --no-daemon --console=plain

      - name: Ambil versi
        id: ver
        run: echo "v=$(grep "version = '" build.gradle | head -1 | sed "s/.*version = '//;s/'.*//")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: mmdskin-fabric-jar
          path: |
            fabric/build/libs/mmdskin-fabric-*.jar
            !fabric/build/libs/*-dev*.jar
            !fabric/build/libs/*-sources*.jar
          if-no-files-found: error

      # Tag v* -> otomatis jadi Release (jar + library native Android untuk folder mmdskin-natives)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fabric/build/libs/mmdskin-fabric-*.jar
            native-libs/native-android-arm64/libmmd_engine.so
